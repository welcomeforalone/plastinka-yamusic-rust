activity-compose = "1.9.3"
lifecycle = "2.8.7"
navigation-compose = "2.8.5"
media3 = "1.5.1"
okhttp = "4.12.0"
serialization = "1.7.3"
security-crypto = "1.1.0-alpha06"
coil = "2.7.0"
core-ktx = "1.15.0"
