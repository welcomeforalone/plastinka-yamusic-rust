[package]
name = "plastinka"
version = "0.1.0"
edition = "2024"
description = "Неофициальный десктопный клиент Яндекс Музыки: только потоковое воспроизведение"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
keyring-core = "1.0.1"
reqwest = { version = "0.13", features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
toml = "1.2.0"
uuid = { version = "1.29.0", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

# Правило проекта: в рабочем коде ничего не паникует. В тестах разрешено (см. clippy.toml).
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
# `println!` и `eprintln!` паникуют, если поток вывода закрыт: пишем через `writeln!`.
print_stdout = "deny"
print_stderr = "deny"
# Индексация и срезы паникуют при выходе за границы: используем `get`.
indexing_slicing = "deny"
string_slice = "deny"

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
