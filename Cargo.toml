[package]
name = "plastinka"
version = "1.0.0"
edition = "2024"
description = "Неофициальный клиент Яндекс Музыки для Windows, Linux и macOS"
license = "GPL-3.0-or-later"
repository = "https://github.com/welcomeforalone/plastinka-yamusic-rust"
publish = false

# Исполняемый файл называется с большой буквы (Plastinka.exe), пакет и библиотека — plastinka.
[[bin]]
name = "Plastinka"
path = "src/main.rs"

[dependencies]
# «Слушать вместе» (src/sync): ECDH P-256 и AES-256-GCM. Apache-2.0 OR ISC. Версия и
# набор features те же, что у reqwest и rustls (без `ring-io` и `untrusted`):
# второй копии и новых крейтов в сборке нет.
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys"] }
# Автозапуск: HKCU\...\Run, ~/.config/autostart, LaunchAgent (MIT).
auto-launch = "0.6"
# Подпись запроса get-file-info (HMAC-SHA256 и base64). Все три — MIT/Apache-2.0.
base64 = "0.23"
# Местная полночь для границы дня в YandexMusicTime (`Local::now`). MIT OR Apache-2.0;
# только `clock`; часовой пояс в Linux и macOS берёт iana-time-zone (MIT OR Apache-2.0).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
hmac = "0.13"
# Рендер только на видеокарте (`wgpu-bare`: без бэкендов wgpu по умолчанию и без
# программного tiny-skia); исполнитель задач — tokio, без `thread-pool`. Бэкенды wgpu
# подключены ниже по платформам.
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu-bare",
    "tokio",
    "svg",
    "image-without-codecs",
    "advanced",
    "crisp",
    "web-colors",
    "linux-theme-detection",
    "x11",
    "wayland",
] }
# Только кодеки для обложек: iced декодирует картинки через этот крейт.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Адреса своих сетевых интерфейсов для подключения вручную («Слушать вместе»).
# MIT OR Apache-2.0; та же версия, что тянет mdns-sd.
if-addrs = "0.15"
keyring-core = "1.0.1"
# Обнаружение устройств по mDNS/DNS-SD («Слушать вместе»), Apache-2.0 OR MIT.
# Без `async` и `logging`; тянет flume, socket-pktinfo и if-addrs (MIT или
# Apache-2.0), остальное в сборке уже есть.
mdns-sd = { version = "0.22", default-features = false }
md-5 = "0.11"
# Теги скачанных треков (ID3v2, MP4, Vorbis), MIT OR Apache-2.0. Фича по умолчанию
# нужна: без неё крейт не собирается.
lofty = "0.25.5"
open = "5.4.5"
# Без `charset` из набора по умолчанию: он тянет encoding_rs (таблицы кодировок
# на сотни КБ), а все ответы — UTF-8. TLS — rustls с aws-lc-rs, как и было.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy", "form", "json"] }
# Системный диалог выбора своего файла (FckCensor).
rfd = "0.17.2"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
# MP3 — поток Яндекса; остальное — свои файлы пользователя (FckCensor).
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm", "isomp4", "aac"] }
thiserror = "2.0.21"
# `net`, `io-util`, `sync` — локальный IPC Discord (свой клиент RPC, без крейтов).
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal", "net", "io-util", "sync"] }
toml = "1.2.0"
uuid = { version = "1.29.0", features = ["v4"] }

# Релиз: меньше бинарник. LTO на весь граф и одна единица кодогенерации
# выкидывают неиспользуемый код зависимостей, `strip` убирает таблицу символов.
# `panic` остаётся `unwind` (решение пользователя): паника в фоновом потоке
# (сеть, звук) не роняет всё приложение.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Отладка: в своём коде только номера строк (для бэктрейсов), в зависимостях
# отладочной информации нет — так `target/` растёт в разы медленнее.
[profile.dev]
debug = "line-tables-only"

# В отладочной сборке зависимости (декодер MP3, вывод звука) оптимизируются:
# без этого они в разы медленнее, и звук может рваться. Свой код — как обычно.
[profile.dev.package."*"]
opt-level = 2
debug = false

[lints.rust]
# Исключения с `#[allow(unsafe_code)]`: таймер перетаскивания окна в Windows
# (src/ui/drag_pulse.rs), подключение к консоли терминала в релизе Windows
# (`attach_console` в src/main.rs) и выбор видеокарты через переменную окружения
# (src/ui/gpu.rs).
unsafe_code = "deny"

# Правило проекта: в рабочем коде ничего не паникует. В тестах разрешено (см. clippy.toml).
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
# `println!` и `eprintln!` паникуют, если поток вывода закрыт: пишем через `writeln!`.
print_stdout = "deny"
print_stderr = "deny"
# Индексация и срезы паникуют при выходе за границы: используем `get`.
indexing_slicing = "deny"
string_slice = "deny"

[target."cfg(windows)".dependencies]
# Бэкенды wgpu (MIT OR Apache-2.0) выбираем сами: iced с `wgpu-bare` их не включает,
# а `wgpu/default` тянул бы все сразу. Версия та же, что у `iced_wgpu` (27.x), поэтому
# в сборке одна копия. Windows: только DX12 — wgpu при запуске поднимает драйверы
# всех собранных бэкендов, и с Vulkan и OpenGL окно занимало на 55 МБ больше
# памяти (замер 2026-11-25). Без поддержки DX12 в
# видеокарте Windows рисует программно (WARP). Linux: Vulkan и OpenGL; macOS: Metal.
wgpu = { version = "27.0", default-features = false, features = ["dx12"] }
windows-native-keyring-store = "1.1.0"
# Системный плеер: медиаклавиши и оверлей Windows (SMTC), MIT.
souvlaki = { version = "0.9.3", default-features = false }
# Таймер потока для кадров во время перетаскивания окна и консоль терминала
# для команд в релизе (MIT OR Apache-2.0).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Иконка и сведения о версии внутри Plastinka.exe (build.rs), MIT. Только для
# сборки под Windows, в бинарник не попадает.
[target."cfg(windows)".build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# Значок в трее и его меню (MIT OR Apache-2.0).
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Linux: Vulkan и OpenGL (подробности у зависимости для Windows выше).
wgpu = { version = "27.0", default-features = false, features = ["vulkan", "gles"] }
# В Linux — через ksni (Unlicense): StatusNotifierItem по D-Bus на чистом Rust,
# без GTK и libappindicator.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
# Системный плеер: своя служба MPRIS (src/media_controls/mpris.rs), MIT. Тот же
# zbus, что уже тянут хранилище секретов и прежний souvlaki: чистый Rust, без
# системной libdbus. Souvlaki в Linux не берём: его MPRIS не двигает позицию
# и не шлёт `Seeked`.
zbus = "5.15"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS: Metal (подробности у зависимости для Windows выше).
wgpu = { version = "27.0", default-features = false, features = ["metal"] }
# Токен в Связке ключей (Keychain).
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
# Системный плеер: медиаклавиши и Now Playing.
souvlaki = { version = "0.9.3", default-features = false }
