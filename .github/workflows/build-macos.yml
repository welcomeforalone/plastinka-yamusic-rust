name: build-macos

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/**"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег релиза, куда положить архив (пусто — только артефакт)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2

      - name: Build aarch64 (Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64 (Intel)
        continue-on-error: true
        env:
          CMAKE_OSX_ARCHITECTURES: x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Assemble artifact
        run: |
          mkdir out
          if [ -f target/x86_64-apple-darwin/release/Plastinka ]; then
            lipo -create -output out/Plastinka \
              target/aarch64-apple-darwin/release/Plastinka \
              target/x86_64-apple-darwin/release/Plastinka
            echo "universal=true" >> "$GITHUB_OUTPUT"
          else
            cp target/aarch64-apple-darwin/release/Plastinka out/Plastinka
            echo "universal=false" >> "$GITHUB_OUTPUT"
          fi
        id: assemble

      - name: Smoke test
        run: out/Plastinka --version

      - name: Zip
        run: |
          chmod +x out/Plastinka
          cd out && zip ../plastinka-macos.zip Plastinka

      - uses: actions/upload-artifact@v4
        with:
          name: plastinka-macos
          path: plastinka-macos.zip
          retention-days: 30

  release:
    needs: macos
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plastinka-macos
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" plastinka-macos.zip
