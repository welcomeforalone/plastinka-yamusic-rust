name: build-windows

# Сборка под Windows x64 (MSVC). Иконку и свойства файла вшивает build.rs
# через rc.exe из Windows SDK — он есть в образе windows-latest.
# Вызывается из release.yml (workflow_call), по push в main и вручную.
# В релиз файлы кладёт только release.yml.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/**"
      - "build.rs"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Коммит или тег для сборки (пусто — текущий)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      # Релиз собран с подсистемой windows: PowerShell не ждёт такой exe,
      # поэтому ждём явно и смотрим код выхода.
      - name: Smoke test
        run: |
          $p = Start-Process -FilePath target\release\Plastinka.exe `
            -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Plastinka --version: код $($p.ExitCode)" }

      - name: Package
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target\release\Plastinka.exe out\Plastinka.exe
          $hash = (Get-FileHash out\Plastinka.exe -Algorithm SHA256).Hash.ToLower()
          # Перевод строки LF: иначе `sha256sum -c` не находит файл из-за \r.
          [IO.File]::WriteAllText("$PWD\out\Plastinka.exe.sha256", "$hash  Plastinka.exe`n")

      - uses: actions/upload-artifact@v4
        with:
          name: plastinka-windows-x64
          path: |
            out/Plastinka.exe
            out/Plastinka.exe.sha256
          retention-days: 30
